services:
  web:
    build: .
    environment:
      - MSSV=2412111032
    volumes:
      - ./app/data:/app/data
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always
